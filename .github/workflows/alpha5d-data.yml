name: Alpha5d public data and ranking

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Alpha5d public source diagnostic']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/alpha5d_pipeline.py'
      - 'scripts/alpha5d_source_fixes.py'
      - 'scripts/alpha5d_runtime.py'
      - 'scripts/alpha5d_engine.py'
      - 'scripts/alpha5d_provider_resilience.py'
      - 'scripts/alpha5d_persist.py'
      - 'scripts/alpha5d_classification.py'
      - 'scripts/vendor/sina_klc_decode.cjs'
      - 'scripts/test_alpha5d_*.py'
      - '.github/workflows/alpha5d-data.yml'
  schedule:
    # Data preparation only: 15:25 after close and 08:05 before the existing report.
    - cron: '25 7 * * 1-5'
    - cron: '5 0 * * 1-5'

permissions:
  contents: write

concurrency:
  group: alpha5d-public-data
  cancel-in-progress: false

jobs:
  build-public-input:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests (not an investment backtest)
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_alpha5d_*.py' -v
      - uses: actions/cache/restore@v4
        with:
          path: .cache/alpha5d/history
          key: alpha5d-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alpha5d-history-v1-
      - name: Collect dated public universe and run unchanged score model
        id: collect
        continue-on-error: true
        run: timeout --signal=INT --kill-after=45s 900s python scripts/alpha5d_runtime.py --output .cache/alpha5d --workers 8
      - name: Preserve collected history even when acceptance fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/alpha5d/history
          key: alpha5d-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive actual inputs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha5d-public-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/alpha5d/runs
            .cache/alpha5d/pipeline_status.json
            .cache/alpha5d/retrieval_progress.json
            .cache/alpha5d/industry_snapshots
            .cache/alpha5d/market
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Persist public result or failure (never claim a failed collector succeeded)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="$RUNNER_TEMP/alpha5d-public-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/alpha5d_persist.py stage --stage "$stage_dir" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-commit "$GITHUB_SHA"
          cp scripts/alpha5d_persist.py "$RUNNER_TEMP/alpha5d-persist.py"
          cp scripts/alpha5d_pipeline.py "$RUNNER_TEMP/alpha5d_pipeline.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python "$RUNNER_TEMP/alpha5d-persist.py" apply --stage "$stage_dir"
            git add data/alpha5d/pipeline_status.json data/alpha5d/runs
            for directory in industry market; do
              if [ -d "data/alpha5d/$directory" ]; then git add "data/alpha5d/$directory"; fi
            done
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record immutable alpha5d run evidence and advance actual latest status'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Enforce data acceptance independently of successful job plumbing
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('.cache/alpha5d/pipeline_status.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          assert d.get('status') in ('COMPLETE','NOT_TRADING_DAY'), d.get('error',d.get('status','NO_RECEIPT'))
          PY
